<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="BarberTime — book a haircut in Almaty in 30 seconds." />
    <meta name="theme-color" content="#FFD60A" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23FFD60A'/%3E%3C/svg%3E" />
    <title>BarberTime — barbershop booking in Almaty</title>
    <script>
      // Apply the saved theme before first paint, so dark mode doesn't flash white.
      // Key must match features/toggle-theme/model/theme.ts
      try {
        if (localStorage.getItem('barbertime:theme') === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
